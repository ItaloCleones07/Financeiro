<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/base.css">
    <link rel="stylesheet" href="../CSS/layout.css">
    <link rel="stylesheet" href="../CSS/componentes.css">

    <title>Cadastro - Itely</title>
</head>

<body>
    <main>
        <h3>CADASTRO</h3>

        <section>
            <label>
                Nome Completo:
                <input placeholder="Digite seu Nome" class="nome-usuario">
            </label>
            <label>
                E-mail:
                <input placeholder="Digite seu E-mail" type="email" class="email-cadastro">
            </label>
            <label>
                Senha:
                <input placeholder="Digite sua Senha" type="password" class="senha-cadastro">
            </label>
            <label>
                Confirmar Senha:
                <input placeholder="Confirme a sua senha" type="password" class="confirmar-senha">
            </label>
        </section>

        <button class="button-cadastro">Cadastrar</button>
    </main>
</body>

<script src="../JS/cadastro.js"></script>

</html>
